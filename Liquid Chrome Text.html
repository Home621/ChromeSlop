<!DOCTYPE html>
<html lang="en">
<head>

<style>

:root[data-theme="dark"]{--bg:#050507;--bg2:#17181f;--fg:#e9eaee;--card:#0d0d11;--field:#16161c;--line:#30313b;--muted:#8d8e9b;--pop:#fff;--v0:#12141a;--v1:#8d94a3;--v2:#f3f5fa}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
.out{position:fixed;inset:0;z-index:0;transition:filter .3s ease,opacity .3s ease;background:repeating-conic-gradient(#8884 0 25%,#0000 0 50%) 0 0/16px 16px}
.view{position:fixed;top:0;bottom:0;left:0;right:0;z-index:1;overflow:hidden;transition:left .22s ease,right .22s ease,filter .3s ease,opacity .3s ease}
.view canvas{position:absolute;left:0;top:0;touch-action:none;cursor:grab}
.hud{position:absolute;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;pointer-events:none;flex-wrap:wrap}
.hud>*{pointer-events:auto}
.hud.top{top:env(safe-area-inset-top,0px)}
.hud.bot{bottom:env(safe-area-inset-bottom,0px)}
.pill{background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.win{position:relative;background:var(--card);border-radius:16px;padding:26px;min-width:0;min-height:0}
.drawer{position:fixed;z-index:5;top:calc(14px + env(safe-area-inset-top,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:320px;display:flex;flex-direction:column;animation:dl .22s ease-out;transition:filter .3s ease,opacity .3s ease}
#dl{left:14px}
#dr{right:14px;animation-name:drr}
.vine{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.5))}
.vine .s0{stop-color:var(--v0)}.vine .s1{stop-color:var(--v1)}.vine .s2{stop-color:var(--v2)}
.vn{fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.hl{fill:none;stroke:rgba(255,255,255,.55);stroke-width:.7;stroke-linecap:round;stroke-linejoin:round}
.th{stroke:var(--v0);stroke-width:.5}
.twc{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
@keyframes dl{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes drr{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.dh h2,.bk h2{margin:0;font:700 30px/1.05 'UnifrakturCook',serif;background:linear-gradient(180deg,var(--fg),#8a8e9b 55%,var(--fg));-webkit-background-clip:text;background-clip:text;color:transparent}
.scroll{flex:1;min-height:0;overflow:auto;margin:0 -8px;padding:0 8px;scrollbar-width:thin}
details{border-top:1px solid var(--line);padding:10px 0 12px}

.w2{grid-column:1/-1}

.lb output{color:var(--fg);font-variant-numeric:tabular-nums}

textarea{font-size:18px;resize:vertical}

input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--v1) var(--p),var(--line) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--v1) var(--p),var(--line) var(--p))}

button:hover{filter:brightness(1.08)}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pop);outline-offset:2px}
button.x{padding:2px 10px;font-size:17px;line-height:1.2}
.chk{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--fg)}
.viewl{flex-direction:row;align-items:center;gap:6px}
.viewl select{width:auto}
.note{font-size:12px;color:var(--muted);margin:0}
.note:empty{display:none}
.presets{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pr{display:flex;align-items:center;gap:8px;text-align:left;padding:6px 8px;font-size:12px;font-weight:600;color:var(--fg);background:var(--field);border:1px solid var(--line);box-shadow:none;border-radius:9px}
.pr:hover{filter:none;border-color:var(--v1)}
.pr.on{border-color:var(--pop);box-shadow:inset 0 0 0 1px var(--pop)}
.pr i{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.45);box-shadow:inset 0 1px 1px rgba(255,255,255,.6)}
.seg{display:flex;gap:4px}
.seg button{flex:1;padding:5px 6px;font-size:12px;font-weight:600}
.seg button[aria-pressed=true]{outline:2px solid var(--pop);outline-offset:-2px}
.block{display:none;position:fixed;inset:0;z-index:100;place-items:center;padding:20px}
.bk{max-width:340px;text-align:center}
.bk h2{margin:0 0 10px}
.bk p{margin:0;color:var(--muted);font-size:14px}
.bk p+p{margin-top:8px;font-size:12px}
.drop{outline:3px dashed var(--pop);outline-offset:-10px}
@media(max-width:819px){.out,.view,.drawer{filter:blur(12px);opacity:.28;pointer-events:none;user-select:none}.block{display:grid}}
</style>
</head>
<body>

<div class="view" id="view">

<button id="sv" type="button">Save PNG</button>

</div>
</div>

</aside>
<div class="block" id="blk" role="alert"><div class="win bk"><h2>Chrome Type</h2><p>This tool needs a wide screen to work. Open it on a desktop or laptop, or widen your window.</p><p>Minimum width: 820px</p></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== core: math, fields, LUTs ===== */
var $=function(i){return document.getElementById(i)};
function clamp(v,a,b){return v<a?a:v>b?b:v}
function mix(a,b,t){return a+(b-a)*t}
function sstep(a,b,x){x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)}

/* ---- float16 packing (table driven) ---- */

else{bt[i]=31744;bt[i|256]=64512;st[i]=13;st[i|256]=13}}

if(typeof Float16Array!=='undefined'){try{var h=new Float16Array(n);h.set(a);return new Uint16Array(h.buffer)}catch(e){}}

/* ---- separable box/gauss blur with clamped edges ---- */

boxH(a,t,W,H,r);boxV(t,o,W,H,r);boxH(o,t,W,H,r);boxV(t,o,W,H,r);boxH(o,t,W,H,r);boxV(t,o,W,H,r);return o}

/* ---- exact euclidean distance transform (Felzenszwalb) ---- */
function dt1(f,d,n,v,z){var k=0,q,s,p;v[0]=0;z[0]=-1e30;z[1]=1e30;
for(q=1;q<n;q++){for(;;){p=v[k];s=((f[q]+q*q)-(f[p]+p*p))/(2*q-2*p);if(s<=z[k])k--;else break}k++;v[k]=q;z[k]=s;z[k+1]=1e30}

function sdfFromMask(M,W,H){var N=W*H,a=new Float64Array(N),b=new Float64Array(N),d=new Float32Array(N),i,ins;
for(i=0;i<N;i++){ins=M[i]>=.5;a[i]=ins?1e9:0;b[i]=ins?0:1e9}
edt(a,W,H);edt(b,W,H);

/* local half-width: for every pixel, the largest distance reached along its own flow line toward the medial axis */
function localWidth(d0,d1,W,H){var N=W*H,nxt=new Int32Array(N),w=new Float32Array(N),x,y,i,gx,gy,gm,j,it;
for(y=0;y<H;y++)for(x=0;x<W;x++){i=y*W+x;nxt[i]=i;if(d0[i]<=0)continue;w[i]=d0[i];

for(it=0;it<8;it++){for(i=0;i<N;i++){j=nxt[i];if(j!==i){if(w[j]>w[i])w[i]=w[j];nxt[i]=nxt[j]}}}

/* packed RGBA field: R = smooth distance (direction), G = local half-width, B = sharp distance (profile), A = coverage */
function packField(d0,M,W,H,sg){var d1=gauss(d0,W,H,sg),w=localWidth(d0,d1,W,H),ds=gauss(d0,W,H,1.1),N=W*H,o=new Float32Array(N*4),i,q,ins=new Float32Array(N),sw=Math.max(1.6,sg*.55);

/* ---- 1D lookup tables from stops ---- */
function lutFrom(stops,n,ease){var o=new Float32Array(n*3),i,j,u,a,b,x,k,t;
for(i=0;i<n;i++){x=i/(n-1);k=stops.length-1;
for(j=1;j<stops.length;j++){if(x<=stops[j][0]){k=j;break}}
a=stops[k-1]||stops[0];b=stops[k];
t=b[0]>a[0]?clamp((x-a[0])/(b[0]-a[0]),0,1):0;if(ease!==0)t=t*t*(3-2*t);
for(j=0;j<3;j++){var av=a.length>2?a[1+j]:a[1],bv=b.length>2?b[1+j]:b[1];o[i*3+j]=av+(bv-av)*t}}

function blurLut(a,n,w){if(w<.5)return a;var o=new Float32Array(a.length),r=Math.round(w),i,j,c,s,k,ii;
for(i=0;i<n;i++){for(c=0;c<3;c++){s=0;k=0;for(j=-r;j<=r;j++){ii=i+j;if(ii<0)ii=0;if(ii>n-1)ii=n-1;var wt=1-Math.abs(j)/(r+1);s+=a[ii*3+c]*wt;k+=wt}o[i*3+c]=s/k}}return o}

/* ---- bevel profile: tilt angle (rad) and normalised height vs depth t=d/R ---- */
var PROFS={

linear:function(u){return 1.5708*(1-u)},
pillow:function(u){return 1.5708*Math.pow(1-u,1.6)},
soft:function(u){return 1.5708*Math.pow(1-u,2.5)},

/* ---- contours of the mask (marching squares) for 3D side walls ---- */
